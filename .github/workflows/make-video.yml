name: make-video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Chủ đề video
        required: true
      row_id:
        description: Số dòng trong Google Sheet
        required: false
      genre:
        description: URBAN, PSYCHOLOGICAL, FOLK, ANALOG, GOTHIC (trống = tự chọn)
        required: false
      voice_style:
        description: DEEP, WHISPER, EMOTIONLESS (trống = theo thể loại)
        required: false
      duration_sec:
        description: Thời lượng mong muốn (giây)
        required: false
        default: "90"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài FFmpeg và font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Cài thư viện Python
        run: pip install -U edge-tts requests gTTS

      - name: Tạo video
        env:
          TOPIC: ${{ inputs.topic }}
          GENRE: ${{ inputs.genre }}
          VOICE_STYLE: ${{ inputs.voice_style }}
          DURATION_SEC: ${{ inputs.duration_sec }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_video.py

      - name: Phát hành file và báo về Make
        env:
          GH_TOKEN: ${{ github.token }}
          ROW_ID: ${{ inputs.row_id }}
          WEBHOOK: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          TAG="v-${{ github.run_id }}"
          gh release create "$TAG" out/video.mp4 --title "$TAG" --notes "auto"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/video.mp4"
          if [ -n "$WEBHOOK" ]; then
            jq -n --arg url "$URL" --arg row "$ROW_ID" --slurpfile m out/meta.json \
              '{status:"Done",error_note:"",video_url:$url,row_id:$row,title:$m[0].title,caption:$m[0].caption}' > payload.json
            curl -sS -X POST -H "Content-Type: application/json" -d @payload.json "$WEBHOOK"
          else
            echo "Chưa có MAKE_WEBHOOK_URL, bỏ qua bước gửi về Make. Video: $URL"
          fi

      - name: Báo lỗi về Make
        if: failure()
        env:
          ROW_ID: ${{ inputs.row_id }}
          WEBHOOK: ${{ secrets.MAKE_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$WEBHOOK" ]; then
            jq -n --arg row "$ROW_ID" --arg note "Lỗi, xem log: $RUN_URL" \
              '{status:"Error",error_note:$note,video_url:"",row_id:$row,title:"",caption:""}' > err.json
            curl -sS -X POST -H "Content-Type: application/json" -d @err.json "$WEBHOOK"
          fi
